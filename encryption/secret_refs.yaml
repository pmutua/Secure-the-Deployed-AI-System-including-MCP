# Deliverable 1: names are config, values are not.
#
# vault_name is honestly "local-env" -- this capstone has no Azure
# subscription or AWS account this week (see README's "Fallbacks
# declared"). provider stays azure-key-vault so kms_twin.json still has
# something to be the twin of, and because a fabricated vault name would
# be a lie the first reviewer who asks for the resource identifier would
# catch -- see the capstone brief: "if the brief says unhackable, rewrite
# it" applies just as much to a fabricated resource name.
provider: azure-key-vault
vault_name: local-env
jwt_secret:
  name: jwt-signing-key
  env: JWT_SECRET
subject_pepper:
  name: rights-lookup-pepper
  env: SUBJECT_PEPPER
local_fernet_key:
  name: at-rest-demo-key
  env: LOCAL_FERNET_KEY
openai_api_key:
  name: openai-api-key
  env: OPENAI_API_KEY
